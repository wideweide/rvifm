[package]
name = "rvifm"
version = "0.1.0"
edition = "2024"
description = "Vim-style TUI file manager written in Rust; references vifm's interaction model, not a fork"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wideweide/rvifm"

[dependencies]
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
zip = "9.5.1"

[dev-dependencies]
tempfile = "3.27.0"
