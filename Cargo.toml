[package]
name = "rvifm"
version = "0.11.1"
edition = "2024"
description = "Vim-style TUI file manager written in Rust; references vifm's interaction model, not a fork"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wideweide/rvifm"

# M40-2：fuzz/ 独立工作区（cargo-fuzz，nightly+libFuzzer；不进主构建）。
[workspace]
exclude = ["fuzz"]

[dependencies]
russh = "0.65"
russh-sftp = "3.0"
tokio = { version = "1.54.1", features = ["full"] }
bzip2-rs = "0.1.2"
devicons = "0.6.13"
flate2 = "1.1.11"
# M22-2：known_hosts hashed hostname 校验（HMAC-SHA1；三者均已在依赖树，零新增 crate）。
hmac = "0.13"
sha1 = "0.11"
base64ct = "1.8"
# M25-4：归档校验文件（md5 默认 / sha256 可选；RustCrypto 系纯 Rust，与 sha1 同 digest 核心）。
md-5 = "0.11"
sha2 = "0.11"
ignore = "0.4.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# M21-F1：底部详情/属性列的时间格式化（本地时区；已在依赖树中，零新增传递依赖）。
jiff = "0.2.43"
lzma-rs = "0.3.0"
office_oxide = "~0.1.16"
opaline = "0.4.2"
pdf-inspector = "=1.25.2"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
redb = "4.5.0"
regex = "1.13.1"
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
toml = "1.2.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
notify = { version = "8.2.2", default-features = false, features = ["macos_fsevent"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
sevenz-rust = "0.6"

[features]
pdf-visual = ["dep:exprim"]

# MISC-1：`rv` 短别名——与 `rvifm` 同一 `src/main.rs`，行为完全一致；
# 项目名/crate 名/主二进制名仍为 `rvifm`（AGENTS §5.1）。
[[bin]]
name = "rvifm"
path = "src/main.rs"

[[bin]]
name = "rv"
path = "src/main.rs"
# 同一 main.rs——单元测试只随主二进制跑一次（避免双份测试时间）。
test = false
bench = false

[dev-dependencies]
tempfile = "3.27.0"
# M40-1：criterion 性能基准（benches/rvifm_bench.rs；dev-dep 不进发布依赖树）。
criterion = { version = "0.7", default-features = false, features = [
    "cargo_bench_support",
] }

# M40-1：lib 单测不进 bench 靶（cargo bench 只跑 criterion benches/）。
[lib]
bench = false

[[bench]]
name = "rvifm_bench"
harness = false

# M11-12：exprim 仅在 pdf-visual feature 下编译（非默认依赖）。
[dependencies.exprim]
version = "=0.4.0"
optional = true

# M11-13：pdf-visual 的 exprim per-page panic 边界依赖 catch_unwind，
# release 不得设为 abort（AGENTS §5.5 硬约束，显式固化防回归）。
[profile.release]
panic = "unwind"
