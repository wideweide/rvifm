[package]
name = "rvifm"
version = "0.1.0"
edition = "2024"
description = "Vim-style TUI file manager written in Rust; references vifm's interaction model, not a fork"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wideweide/rvifm"

[dependencies]
bzip2-rs = "0.1.2"
devicons = "0.6.13"
flate2 = "1.1.11"
lzma-rs = "0.3.0"
ratatui = "0.30.2"
redb = "4.5.0"
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
toml = "1.2.1"
zip = "9.5.1"

[dev-dependencies]
tempfile = "3.27.0"
