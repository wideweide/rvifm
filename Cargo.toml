[package]
name = "rvifm"
version = "0.3.0"
edition = "2024"
description = "Vim-style TUI file manager written in Rust; references vifm's interaction model, not a fork"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wideweide/rvifm"

[dependencies]
bzip2-rs = "0.1.2"
devicons = "0.6.13"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
lzma-rs = "0.3.0"
office_oxide = "~0.1.16"
opaline = "0.4.2"
pdf-inspector = "=1.25.2"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
redb = "4.5.0"
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
toml = "1.2.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[features]
pdf-visual = ["dep:exprim"]

[dev-dependencies]
tempfile = "3.27.0"

# M11-12：exprim 仅在 pdf-visual feature 下编译（非默认依赖）。
[dependencies.exprim]
version = "=0.4.0"
optional = true

# M11-13：pdf-visual 的 exprim per-page panic 边界依赖 catch_unwind，
# release 不得设为 abort（AGENTS §5.5 硬约束，显式固化防回归）。
[profile.release]
panic = "unwind"
