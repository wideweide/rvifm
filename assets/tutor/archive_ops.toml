# M43-4：导师模式内容批 2——归档模块。
# 语义对照：归档进入（M7 只读 VFS + M26-3 7z + M34-6 jar）、:archive 创建
# （M25-3/M26-1 后台作业 + M26-2 7z + M26-4 外部 CLI）、:extract（M37-2
# zip-slip 防护 + job 化 + u 可逆）、校验文件（M25-4）。

[module]
id = "archive_ops"
name = "归档操作 (Archives)"
description = "掌握归档浏览、创建与解压"

[[items]]
id = "archive_enter"
prompt = "光标停在 `demo.zip`（或 .tar.gz/.7z/.jar）上按 `l`。"
expected = "进入只读虚拟目录，状态栏/面包屑显示 `归档名:/内部路径`；写操作被拒绝；`h` 返回物理目录。"

[[items]]
id = "archive_create"
prompt = "选中几个文件后输入 `:archive zip 打包.zip` 回车。"
expected = "后台作业创建归档（UI 不卡，:jobs 可见可取消），完成入撤销栈——`u` 删除归档可逆。"

[[items]]
id = "archive_checksum"
prompt = "输入 `:archive zip 打包.zip checksum=sha256` 回车。"
expected = "创建归档并生成校验文件（缺省 md5，可 sha256/none）。"

[[items]]
id = "archive_7z"
prompt = "输入 `:archive 7z 打包.7z` 回车。"
expected = "内建 7z 创建（sevenz-rust2）；rar/cab/lzh/tar.xz 等走外部 CLI，缺失时给出可读提示。"

[[items]]
id = "extract"
prompt = "光标停在 `打包.zip` 上输入 `:extract` 回车。"
expected = "缺省解压到**对侧 pane** 物理目录（也可 `left`/`right`/`当前`/`对侧`/路径指定）；zip-slip 防护；逐成员 `u` 可逆。"

[[items]]
id = "archive_member_paste"
prompt = "进入归档虚拟目录，`yy` 标记一个成员，切到对侧物理目录按 `p`。"
expected = "按成员解压到焦点 pane 物理目录（不写归档内）；逐成员 `u` 可逆。"
