# M42-3：向导模式首批内容——核心导航模块。
# 条目语义与代码行为对齐：j/k 环绕（M13-4）、l/h 进入与返回定位（M21-F4）、
# gg/G（M1-3）、Tab 焦点切换（M14-1）。

[module]
id = "core_nav"
name = "核心导航 (Core Navigation)"
description = "掌握 rvifm 的基础移动与目录切换"

[[items]]
id = "move_down"
prompt = "请按 `j` 向下移动光标。"
expected = "光标下移一行（到末行再按会环绕回首行）。"

[[items]]
id = "move_up"
prompt = "请按 `k` 向上移动光标。"
expected = "光标上移一行。"

[[items]]
id = "enter_dir"
prompt = "光标停在目录上，按 `l` 或 Enter 进入。"
expected = "进入该目录，pane 顶部路径更新。"

[[items]]
id = "parent_dir"
prompt = "按 `h` 返回上级目录。"
expected = "回到上级目录，光标定位在刚才进入的子目录上；再按 `l` 重返会还原子目录内上次的光标（不会停在 `..` 行）。"

[[items]]
id = "jump_top"
prompt = "按 `gg`（两连按 g）跳到列表顶部。"
expected = "光标移到首行。"

[[items]]
id = "jump_bottom"
prompt = "按 `G` 跳到列表底部。"
expected = "光标移到末行。"

[[items]]
id = "focus_switch"
prompt = "按 `Tab` 切换左右 pane 焦点，再按一次切回。"
expected = "焦点换到另一侧（当前行高亮样式随焦点变化），预览跟随焦点 pane。"

[[items]]
id = "focus_switch_space"
prompt = "按 `Space`（空格）切换活动窗格。"
expected = "与 Tab 等效的窗格切换（vifm 语义，两键并存）。"

[[items]]
id = "cmd_quit"
prompt = "输入 `:quit` 或按 `q`（了解即可）。"
expected = "退出 rvifm；退出前保存会话/撤销现场，临时副本统一清理。与命令行的 `q` 别名一致。"
