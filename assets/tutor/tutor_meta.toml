# M43-5：向导内容批 3——tutor 自身（meta 模块）。
# M66：前三条按「重要的事情说三遍」提示真实操作风险；稳定 ID 不变。

[module]
id = "tutor_meta"
name = "向导模式用法 (Tutor Itself)"
description = "本模式的按键、安全提醒、错题本与重置"

[[items]]
id = "tutor_keys"
prompt = "重要的事说三遍（第 1 遍）：向导期间的文件操作是真实操作，练习务必小心！按 `Ctrl+Y` 标记掌握，再按 `Ctrl+N` 改记错题。"
expected = "Ctrl+Y 掌握、Ctrl+N 未掌握记错题本，作答后即时落盘并自动推进；其余按键照常操作文件（练习键不被拦截）。请记住第 1 遍提醒：这里是真实操作。"

[[items]]
id = "tutor_passthrough"
prompt = "重要的事说三遍（第 2 遍）：向导会在临时沙箱准备练习文件，但按键与命令是真实操作，会真实修改当前目录内容！按 `j` 移动光标或按 `:` 执行一条命令。"
expected = "练习照常执行、面板保持显示；进入命令/帮助等模式不会丢失进度。第 2 遍提醒：沙箱只是练习位置，操作本身真实生效，务必小心。"

[[items]]
id = "tutor_exit"
prompt = "重要的事说三遍（第 3 遍）：练习会真实修改文件，务必小心！按 `Ctrl+Q` 退出向导面板。"
expected = "面板关闭，作答已即时保存（每步落盘，中途退出/退出应用均不丢）。退出后随时输入 `:tutor` 可重新进入向导；模块全部结束时按 `Enter` 也可回到模块列表。"

[[items]]
id = "tutor_review"
prompt = "下次进入有记录的模块。"
expected = "只显示错题（skipped）条目且编号与原模块保持一致；Ctrl+Y/Ctrl+N 作答；全部结束后按 Enter 回模块列表；进度按稳定 ID 保存，跨版本忽略未知条目。"

[[items]]
id = "tutor_reset"
prompt = "输入 `:tutor reset core_nav` 清空该模块进度。"
expected = "该模块错题本与掌握记录清空，下次进入从头开始；向导列表内把光标移到模块按 `d` 也可重置并即时刷新进度。进度文件在数据目录 tutor_progress.toml（删文件等效重置）。首次启动还会在配置目录生成带注释的 config.toml 与键位/opener 示例，不覆盖已有文件。列表内 `/` 可按模块名搜索跳转；有记录的模块进入后只显示错题。"
