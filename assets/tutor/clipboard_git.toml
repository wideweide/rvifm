# M43-5：向导模式内容批 3——剪贴板与 git 模块。
# 语义对照：y 序列（M23-10 OSC52 优先）、gi 键/:gi（M25-6 探测
# gitui→ziggity→lazygit）、git 状态列/状态栏（M25-5 异步缓存）。

[module]
id = "clipboard_git"
name = "剪贴板与 git (Clipboard & Git)"
description = "复制序列与 git 集成（环境依赖项可跳过）"

[[items]]
id = "yank_name"
prompt = "光标停在文件上按 `yn`。"
expected = "文件名复制到系统剪贴板/OSC52（状态栏提示；终端需支持剪贴板同步）。"

[[items]]
id = "yank_path"
prompt = "按 `yf`。"
expected = "全路径（正斜杠规范化）复制到剪贴板。"

[[items]]
id = "yank_content"
prompt = "光标停在文本文件上按 `yc`。"
requires = "osc52"
expected = "文件内容复制到剪贴板（OSC52 转义序列；终端不支持时提示降级）。"

[[items]]
id = "git_column"
prompt = "cd 到任一 git 仓库内启动 rvifm。"
requires = "git"
expected = "文件列表出现异步 git 状态列（M/A/?? 着色），状态栏显示分支与 diff 摘要。"

[[items]]
id = "git_ui"
prompt = "在仓库内按 `gi`（或输入 `:gi`）。"
requires = "git"
expected = "探测 gitui→ziggity→lazygit 顺序挂起 TUI 启动外部 git TUI；均未安装时给出可读提示。"

[[items]]
id = "git_diff_fullscreen"
prompt = "在 git 仓库内输入 `:diff`，再按 `|`。"
requires = "git"
expected = "补丁按文件类型语法高亮；`|` 进全屏左右对照（连续分隔线 + 增删行/词级差异高亮），`=` 完整文件、`^w` 换行、`J/K` 跳 hunk。"

[[items]]
id = "git_log"
prompt = "在 git 仓库内输入 `:log`。"
expected = "显示提交历史只读列表；非 git 仓库给可读提示，不修改仓库。"

[[items]]
id = "git_blame"
prompt = "光标停在受版本控制的文件上输入 `:blame`。"
expected = "逐行显示提交归属（作者/提交号），只读；无 git 仓库给可读提示。"

[[items]]
id = "git_stash"
prompt = "在 git 仓库内输入 `:stash`（了解即可）。"
expected = "列出/应用 stash；写操作需确认，不自动改写工作区。"

[[items]]
id = "git_branch"
prompt = "在 git 仓库内输入 `:branch`。"
expected = "只读列出本地分支与当前分支标记，不执行切换。"
