name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      # AUDIT-9：clippy 覆盖测试代码（--all-targets）。
      # 0.10.0：tee 到 test-output.txt（clippy 失败时 digest 步骤可读错误行）。
      - name: clippy
        shell: bash
        # errexit 会在管道失败时立即退出——吞掉退出码，注解后再按结果退出。
        run: |
          set +e
          cargo clippy --all-targets -- -D warnings 2>&1 | tee test-output.txt
          grep -E "^error" -A3 test-output.txt | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          if grep -qE "^error" test-output.txt; then
            exit 1
          fi
          exit 0
      - name: build
        shell: bash
        run: |
          set +e
          cargo build --locked 2>&1 | tee build-output.txt
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            bash .github/workflows/annotate_errors.sh build-output.txt
          fi
          exit $rc
      # M11-15：pdf-visual feature 门控的 exprim 编译验证（双平台）。
      - name: check pdf-visual feature
        run: cargo check --locked --features pdf-visual
      # AUDIT-9：Linux target cross-check 入 CI（M12-2 教训：Windows 的
      # clippy/build 不编译 cfg(unix) 测试代码；本机自 russh 起无法构建
      # aws-lc-sys，由 ubuntu job 承担同款检查——host triple 即该 target）。
      - name: check linux target (all-targets)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --locked --target x86_64-unknown-linux-gnu --all-targets
      - name: test
        shell: bash
        run: |
          set -o pipefail
          if RUST_BACKTRACE=1 cargo test --locked -- --test-threads=1 2>&1 | tee test-output.txt; then
            exit 0
          else
            # 失败行以 ::error:: 注解输出（check-run annotations 匿名可读）。
            grep -E "FAILED|panicked at" -A2 test-output.txt | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
      # 失败诊断：把失败摘要作为 check-run annotation 追加（匿名 API 可读）。
      - name: publish failure digest
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOB_ID=$(gh run view ${{ github.run_id }} --json jobs --jq '.jobs[] | select(.conclusion=="failure") | .databaseId' | head -1)
          touch test-output.txt
          grep -E "^test .* FAILED|panicked at|error\[|^error" test-output.txt | head -25 > digest.txt || true
          [ -s digest.txt ] || tail -60 test-output.txt > digest.txt
          SUMMARY=$(jq -Rs . < digest.txt)
          NAME=$(gh api "repos/${{ github.repository }}/check-runs/$JOB_ID" --jq '.name')
          # 1) PATCH output（title/summary 匿名可读）；2) 追加 annotation。
          gh api "repos/${{ github.repository }}/check-runs/$JOB_ID" -X PATCH --input - \
            <<< "{\"name\":\"$NAME\",\"output\":{\"title\":\"failure digest\",\"summary\":$SUMMARY}}" \
            || echo "PATCH failed"
          gh api "repos/${{ github.repository }}/check-runs/$JOB_ID/annotations" -X POST --input - \
            <<< "[{\"path\":\"test-output.txt\",\"start_line\":1,\"end_line\":1,\"annotation_level\":\"notice\",\"message\":$SUMMARY}]" \
            || echo "annotation post failed"
      - name: upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test-output.txt

  # M101-2：harness 文档一致性门禁（R12 注入 main CI 结论）。
  # needs 取其余 job 的聚合结论；本 job 自身不参与，避免自指。
  harness:
    name: harness consistency
    # M101-7：R12 只校验 main 的 CI 结论；tag run 不注入，避免 fuzz
    # 超时/取消被误判为「文档写全绿」。
    if: always() && github.ref == 'refs/heads/main'
    needs: [test, fuzz, supply-chain]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: harness_check
        env:
          RVIFM_MAIN_CI: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
        run: python3 scripts/harness_check.py

  # M40-2：cargo-fuzz 模糊测试（SPEC M40-2 SIMPLIFIED——CI 内 10 分钟总量；
  # 24h 本地长跑记录随 Linux 开发机，见 NOTES）。libFuzzer 需 nightly。
  fuzz:
    runs-on: ubuntu-latest
    # M101-7：安装 nightly + cargo-fuzz、构建 5 靶 + 480s 实测在慢 runner
    # 上会超过 25m（tag run 46140235498 两次超时），放宽到 45m。
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: install nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
      - name: build fuzz targets
        shell: bash
        run: |
          set +e
          cargo +nightly fuzz build -O --debug-assertions 2>&1 | tee fuzz-build.txt
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            bash .github/workflows/annotate_errors.sh fuzz-build.txt
          fi
          exit $rc
      - name: fuzz archive parsers (3 x 120s)
        run: |
          for t in fuzz_zip fuzz_tar fuzz_7z; do
            cargo +nightly fuzz run "$t" -- -max_total_time=120 -rss_limit_mb=4096 -max_len=1048576
          done
      - name: fuzz paths + entry record (2 x 60s)
        run: |
          for t in fuzz_paths fuzz_entry_record; do
            cargo +nightly fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=4096 -max_len=65536
          done

  # M40-5：供应链门禁——cargo-deny（许可证/通告/来源）+ cargo-audit（RUSTSEC）
  # + CycloneDX SBOM 产物。
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install tooling
        run: cargo install --locked cargo-deny cargo-audit cargo-cyclonedx
      - name: cargo deny check
        run: cargo deny check
      - name: cargo audit
        shell: bash
        run: |
          set +e
          cargo audit 2>&1 | tee audit-output.txt
          rc=${PIPESTATUS[0]}
          grep -E "RUSTSEC|error|Crate" -A2 audit-output.txt | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit $rc
      - name: SBOM (CycloneDX)
        run: cargo cyclonedx --format json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: rvifm.cdx.json

  # M6-5 发布门禁：tag 推送（v*）时双平台 --release 构建并产出归档，
  # 自动创建 GitHub Release 并上传产物（0.2.0 起，页面公开可下载）。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # REL-4：仅 musl 归档——移除 gnu 腿；aarch64 也改 musl（静态链接）。
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: rvifm-${{ github.ref_name }}-linux-x64-musl.tar.gz
            binaries: rvifm rv
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: rvifm-${{ github.ref_name }}-windows-x64.tar.gz
            binaries: rvifm.exe rv.exe
          # REL-4：aarch64 musl 交叉编译——cargo-zigbuild + 固定 zig tarball
          # （musl.cc GCC 11 对 aws-lc-sys 有 ICE；裸 zig cc 被 cc-rs 追加的
          # Rust 风格 --target 破坏；cargo-zigbuild 正确翻译，见 NOTES）。
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: rvifm-${{ github.ref_name }}-linux-aarch64-musl.tar.gz
            binaries: rvifm rv
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # REL-4：原生 x64 musl 用系统 musl-tools；aarch64 musl 用 zig 交叉链。
      - name: install musl-tools (native x64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: install zig + cargo-zigbuild (aarch64 musl cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VER=0.14.1
          curl -fsSL "https://ziglang.org/download/${ZIG_VER}/zig-x86_64-linux-${ZIG_VER}.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VER}" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked
      - name: build --release
        shell: bash
        # 2026-11-22：tee + grep 注解（同 clippy/test 模式）——release 腿失败时
        # 注解可见真实错误行（匿名 API 只能读 check-run annotations）。
        run: |
          set +e
          # REL-4：aarch64 musl 走 cargo-zigbuild（zig 已在 PATH），其余常规构建。
          if [[ "${{ matrix.target }}" == aarch64-unknown-linux-musl ]]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }} 2>&1 | tee release-build.txt
          else
            cargo build --release --locked --target ${{ matrix.target }} 2>&1 | tee release-build.txt
          fi
          rc=${PIPESTATUS[0]}
          # M40-7 教训：`grep -E "error" -A4` 被 crate 名误报挤爆注解上限，
          # 真实 error 行丢失——精确化 helper（行首 error 锚定，见脚本头注释）；
          # 仅失败时注解（成功腿不发射日志尾部误报）。
          if [ $rc -ne 0 ]; then
            bash .github/workflows/annotate_errors.sh release-build.txt
          fi
          exit $rc
      - name: smoke --version
        shell: bash
        # aarch64 交叉产物在 x86_64 runner 不可执行；qemu 冒烟 CI 实测不稳
        # （apt 安装 exit 100，runs 44982915466/44983912760）——改为确定性
        # ELF 断言。REL-4：aarch64 改静态 musl，断言架构 + 静态链接（无
        # libc.so.6 NEEDED）；x64 musl/windows 仍执行 --version 冒烟。
        run: |
          if [[ "${{ matrix.target }}" == aarch64-unknown-linux-musl ]]; then
            bin=./target/aarch64-unknown-linux-musl/release/rvifm
            test -x "$bin"
            file "$bin" | grep -q "ARM aarch64"
            file "$bin" | grep -q "statically linked"
            echo "aarch64 musl ELF 架构与静态链接断言通过"
          else
            cargo run --release --locked --target ${{ matrix.target }} --bin rvifm -- --version
          fi
      - name: archive
        shell: bash
        run: |
          mkdir -p dist
          tar czf dist/${{ matrix.archive }} -C target/${{ matrix.target }}/release ${{ matrix.binaries }}
      - name: create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "rvifm $GITHUB_REF_NAME" \
            --generate-notes --verify-tag || true
          # REL-3：此处只上传归档；SHA256SUMS 由独立汇总作业在所有归档
          # 上传后一次性生成（原并行 matrix 每腿各自生成并 --clobber，
          # 最后完成腿覆盖其余——v1.0.0/v1.1.0 的 SHA256SUMS 只含 1 行）。
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: rvifm-${{ matrix.target }}
          path: dist/

  # REL-3：单一汇总作业——依赖全部 release matrix 腿完成后才运行；
  # 汇集所有归档到同一 dist/ 一次性算 SHA256SUMS，避免并行覆盖。
  release-checksums:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rvifm-*
          path: dist
          merge-multiple: true
      - name: verify archive count (REL-3)
        shell: bash
        run: |
          cd dist
          n=$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)
          echo "归档数: $n"
          # 数量守卫：REL-4 起 musl-only 共 3 个归档（x64-musl/aarch64-musl/windows）
          test "$n" -eq 3 || { echo "::error::期望 3 个归档，实得 $n"; exit 1; }
      - name: sha256 checksums (REL-3)
        shell: bash
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: upload checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 本作业无 actions/checkout——gh 无法从 .git 推断仓库，须显式 --repo
          gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
