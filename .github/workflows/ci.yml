name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy -- -D warnings
      - name: build
        run: cargo build --locked
      # M11-15：pdf-visual feature 门控的 exprim 编译验证（双平台）。
      - name: check pdf-visual feature
        run: cargo check --locked --features pdf-visual
      - name: test
        shell: bash
        run: |
          RUST_BACKTRACE=1 cargo test --locked -- --test-threads=1 2>&1 | tee test-output.txt
          exit ${PIPESTATUS[0]}
      # 失败诊断：把失败摘要作为 check-run annotation 追加（匿名 API 可读）。
      - name: publish failure digest
        if: failure() && matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOB_ID=$(gh run view ${{ github.run_id }} --json jobs --jq '.jobs[] | select(.conclusion=="failure") | .databaseId' | head -1)
          grep -E "^test .* FAILED|panicked at|error\[|^error" test-output.txt | head -25 > digest.txt || true
          [ -s digest.txt ] || tail -25 test-output.txt > digest.txt
          SUMMARY=$(jq -Rs . < digest.txt)
          NAME=$(gh api "repos/${{ github.repository }}/check-runs/$JOB_ID" --jq '.name')
          # 1) PATCH output（title/summary 匿名可读）；2) 追加 annotation。
          gh api "repos/${{ github.repository }}/check-runs/$JOB_ID" -X PATCH --input - \
            <<< "{\"name\":\"$NAME\",\"output\":{\"title\":\"failure digest\",\"summary\":$SUMMARY}}" \
            || echo "PATCH failed"
          gh api "repos/${{ github.repository }}/check-runs/$JOB_ID/annotations" -X POST --input - \
            <<< "[{\"path\":\"test-output.txt\",\"start_line\":1,\"end_line\":1,\"annotation_level\":\"notice\",\"message\":$SUMMARY}]" \
            || echo "annotation post failed"
      - name: upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test-output.txt

  # M6-5 发布门禁：tag 推送（v*）时双平台 --release 构建并产出归档。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build --release
        run: cargo build --release --locked
      - name: smoke --version
        run: cargo run --release --locked -- --version
      - name: archive
        shell: bash
        run: |
          mkdir -p dist
          if [ -f target/release/rvifm.exe ]; then
            tar czf dist/rvifm-${GITHUB_REF_NAME}-windows-x64.tar.gz -C target/release rvifm.exe
          else
            tar czf dist/rvifm-${GITHUB_REF_NAME}-linux-x64.tar.gz -C target/release rvifm
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rvifm-${{ matrix.os }}
          path: dist/
