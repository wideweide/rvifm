name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy -- -D warnings
      - name: build
        run: cargo build --locked
      # M11-15：pdf-visual feature 门控的 exprim 编译验证（双平台）。
      - name: check pdf-visual feature
        run: cargo check --locked --features pdf-visual
      - name: test
        shell: bash
        run: |
          RUST_BACKTRACE=1 cargo test --locked -- --test-threads=1 2>&1 | tee test-output.txt
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            # 失败测试名/编译错误输出为 annotation（便于匿名 API 排查）。
            grep -E "^test .* FAILED|panicked at|error\[E[0-9]+\]|^error:" test-output.txt | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $code
          fi
      - name: upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test-output.txt

  # M6-5 发布门禁：tag 推送（v*）时双平台 --release 构建并产出归档。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build --release
        run: cargo build --release --locked
      - name: smoke --version
        run: cargo run --release --locked -- --version
      - name: archive
        shell: bash
        run: |
          mkdir -p dist
          if [ -f target/release/rvifm.exe ]; then
            tar czf dist/rvifm-${GITHUB_REF_NAME}-windows-x64.tar.gz -C target/release rvifm.exe
          else
            tar czf dist/rvifm-${GITHUB_REF_NAME}-linux-x64.tar.gz -C target/release rvifm
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rvifm-${{ matrix.os }}
          path: dist/
