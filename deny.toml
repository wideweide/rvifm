# M40-5：cargo-deny 供应链门禁（SPEC M40-5）。
# 策略取向：许可证宽松白名单（MIT/Apache/BSD/ISC/Unicode/MPL/Zlib 系）；
# 安全通告 fail（未缓解 RUSTSEC）；重复依赖 warn（生态现状，不阻断）。

[graph]
# pdf-visual 为可选 feature（默认构建不含）——检查默认图。

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "MIT-0",
    "NCSA",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[advisories]
version = 2
yanked = "warn"
# 通告处置：出现 RUSTSEC 命中时按需在此 ignore（附理由），默认 fail。
ignore = [
    # RUSTSEC-2023-0071（Marvin Attack，rsa crate 计时侧信道）：
    # russh 0.65 传递依赖 rsa 0.9 无上游修复；rvifm 使用场景为 SFTP 客户端
    # 密钥认证（本地进程持有私钥，不在远程密钥持有者位置），该侧信道影响
    # 范围（远程 oracle 攻击）不适用；持续跟踪 russh 上游（rsa → 替换或
    # 缓解版本发布后移除本豁免）。
    "RUSTSEC-2023-0071",
]

[bans]
multiple-versions = "warn"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
