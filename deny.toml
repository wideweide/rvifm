# M40-5：cargo-deny 供应链门禁（SPEC M40-5）。
# 策略取向：许可证宽松白名单（MIT/Apache/BSD/ISC/Unicode/MPL/Zlib 系）；
# 安全通告 fail（未缓解 RUSTSEC）；重复依赖 warn（生态现状，不阻断）。

[graph]
# pdf-visual 为可选 feature（默认构建不含）——检查默认图。

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "MIT-0",
    "NCSA",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

# M101-1：M97 Markdown 预览经 pulldown-cmark-mdcat 2.20.2 引入 unicodeit 0.2.2，
# 其许可为 "MIT AND LPPL-1.3c"（OSI 批准；仅用于 Unicode → LaTeX 符号转换）。
# 只对该 crate 精确豁免 LPPL-1.3c，不全局放开，避免影响其它依赖的许可证门禁。
[[licenses.exceptions]]
allow = ["LPPL-1.3c"]
name = "unicodeit"
version = "0.2.2"

[advisories]
version = 2
yanked = "warn"
# 通告处置：出现 RUSTSEC 命中时按需在此 ignore（附理由），默认 fail。
# 1.0 豁免口径：全部为传递依赖"弃维护/无上游修复"类，迁移 = 砍核心功能
# （语法高亮/SSH/PDF/图像）；每条附暴露面分析，上游动作后移除。
ignore = [
    # RUSTSEC-2023-0071（Marvin Attack，rsa 计时侧信道）：russh 传递依赖，
    # 无上游修复；rvifm 为 SFTP 客户端持钥侧，远程 oracle 场景不适用。
    "RUSTSEC-2023-0071",
    # RUSTSEC-2025-0141（bincode 弃维护）：syntect 传递依赖（高亮定义
    # 反序列化，输入为打包内置文件）。
    "RUSTSEC-2025-0141",
    # RUSTSEC-2026-0543（chrono 弃维护）：lopdf/pdf-inspector 与 russh-sftp
    # 传递依赖（时间戳解析，非不受控输入面）。
    "RUSTSEC-2026-0543",
    # RUSTSEC-2024-0436（paste 弃维护）：image→ravif 传递 proc-macro
    # （仅编译期，运行时零暴露）。
    "RUSTSEC-2024-0436",
    # RUSTSEC-2026-0192（ttf-parser 弃维护）：pdf-inspector 传递依赖
    # （字体度量读取；真 PDF 渲染走 pdf-visual 可选链）。
    "RUSTSEC-2026-0192",
]

[bans]
multiple-versions = "warn"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
